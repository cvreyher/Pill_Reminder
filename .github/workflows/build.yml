name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner ships with the Android SDK; accept the licenses so Gradle can fetch the
      # platform and build tools this project needs.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # Release signing is optional: set the four RELEASE_* secrets (see README) to get a signed
      # release APK. Without them the workflow still produces an installable debug APK.
      - name: Prepare signing key
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          RELEASE_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        id: apks
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/MedicationTracker-$version-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/MedicationTracker-$version.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MedicationTracker-apk
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            **Installieren:** Lade die APK unten herunter und öffne sie auf deinem Android-Handy (ab Android 8).
            ${{ steps.apks.outputs.signed == 'true' && 'Nimm `MedicationTracker-…apk`; die `-debug`-Variante ist nur zum Testen.' || 'Diese Version ist nur mit einem Entwicklerschlüssel signiert (`-debug`). Updates darüber funktionieren nur von weiteren GitHub-Versionen.' }}
